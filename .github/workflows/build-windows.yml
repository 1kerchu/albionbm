name: Compilar app de Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Compilar AlbionBM.exe
        run: >
          pyinstaller --noconfirm --onefile --windowed --name AlbionBM
          --add-data "data;data" --collect-submodules scapy.layers --collect-submodules scapy.arch
          AlbionBM.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: AlbionBM-windows
          path: dist/AlbionBM.exe

name: Publicar versión web (GitHub Pages)

# Alternativa manual. Por defecto la web se sirve directamente desde la rama
# (Settings → Pages → Deploy from a branch): index.html redirige a web/.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests de la versión web
        run: node --test tests/web_calc.test.js tests/web_calculators.test.js
      - name: Montar el sitio
        run: |
          mkdir _site
          cp web/* _site/
          cp data/items.json data/recipes.json _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

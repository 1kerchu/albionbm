name: Publicar versión web (GitHub Pages)

on:
  push:
    branches: ["**"]
    paths: ["web/**", "data/items.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Tests de la versión web
        run: node --test tests/web_calc.test.js
      - name: Montar el sitio
        run: |
          mkdir _site
          cp web/* _site/
          cp data/items.json _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
